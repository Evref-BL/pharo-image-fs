name: Apply MCP release

on:
  repository_dispatch:
    types: [component-release]
  workflow_dispatch:
    inputs:
      mcp_version:
        description: Published MCP version to apply.
        required: true
        type: string

permissions:
  actions: write
  contents: read

jobs:
  update:
    if: github.event_name == 'workflow_dispatch' || github.event.client_payload.component == 'mcp'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ secrets.DEVNEXUS_AUTOMATION_APP_ID }}
          private-key: ${{ secrets.DEVNEXUS_AUTOMATION_PRIVATE_KEY }}
          owner: Evref-BL
          repositories: pharo-image-fs

      - uses: actions/checkout@v6
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Verify the published MCP release
        id: release
        env:
          EVENT_VERSION: ${{ github.event.client_payload.version }}
          INPUT_VERSION: ${{ inputs.mcp_version }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          version="${EVENT_VERSION:-$INPUT_VERSION}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(gh api "repos/Evref-BL/MCP/releases/tags/v${version}" --jq .tag_name)" = "v${version}"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Prepare the update
        id: update
        env:
          MCP_VERSION: ${{ steps.release.outputs.version }}
        run: |
          if [[ "$(.github/scripts/versions.sh mcp)" == "$MCP_VERSION" ]]; then
            exit 0
          fi
          .github/scripts/versions.sh set-mcp "$MCP_VERSION"
          echo "needed=true" >> "$GITHUB_OUTPUT"

      - name: Create update pull request
        id: proposal
        if: steps.update.outputs.needed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          # The bot as author and committer both: left unset, the committer is
          # github-actions[bot] and the author whoever started the run.
          author: devnexus-automation[bot] <286661136+devnexus-automation[bot]@users.noreply.github.com>
          committer: devnexus-automation[bot] <286661136+devnexus-automation[bot]@users.noreply.github.com>
          branch: automation/update-mcp-v${{ steps.release.outputs.version }}
          delete-branch: true
          commit-message: "chore: update MCP to v${{ steps.release.outputs.version }}"
          title: "chore: update MCP to v${{ steps.release.outputs.version }}"
          body: |
            Automated update for the published immutable MCP release.

            This only moves the pin. Releasing it is a separate version bump.

      # Reading the pin is checked here and on every pull request, but only
      # loading proves the version it names exists and still loads. CI does
      # that against every supported Pharo, which is the check worth waiting
      # for.
      #
      # CI runs on macOS, and when GitHub is short of macOS runners a job fails
      # without ever starting: "The job was not acquired by Runner of type
      # hosted". So what failed runs once more before the update gives up; a
      # test that fails fails again.
      - name: Merge after CI
        if: steps.proposal.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RERUN_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.proposal.outputs.pull-request-number }}
          BRANCH: automation/update-mcp-v${{ steps.release.outputs.version }}
        run: |
          for _ in {1..60}; do
            if gh pr checks "$PR_NUMBER" --json name --jq 'length' 2>/dev/null | grep -qx '[1-9][0-9]*'; then
              if ! gh pr checks "$PR_NUMBER" --watch --interval 10; then
                run_id="$(GH_TOKEN="$RERUN_TOKEN" gh run list --workflow CI --branch "$BRANCH" --limit 1 --json databaseId --jq '.[0].databaseId')"
                GH_TOKEN="$RERUN_TOKEN" gh run rerun "$run_id" --failed
                sleep 30
                gh pr checks "$PR_NUMBER" --watch --interval 10
              fi
              gh pr merge "$PR_NUMBER" --squash --delete-branch
              exit 0
            fi
            sleep 5
          done
          echo "No CI checks were reported for PR #$PR_NUMBER."
          exit 1
