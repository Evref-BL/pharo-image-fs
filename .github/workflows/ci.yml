name: CI

# Every push and pull request runs the matrix, so each check the default
# branch requires reports. A change that touches only documentation skips the
# image steps, and the check reports success.
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { pharo: 12, system: Linux, runner: ubuntu-24.04 }
          - { pharo: 13, system: Linux, runner: ubuntu-24.04 }
          - { pharo: 14, system: Linux, runner: ubuntu-24.04 }
          - { pharo: 15, system: Linux, runner: ubuntu-24.04 }
          # One macOS job: macOS runners queue long and are often never
          # given, and what macOS adds over Linux is the platform code, which
          # does not depend on the Pharo version.
          - { pharo: 14, system: macOS, runner: macos-26 }

    name: Pharo ${{ matrix.pharo }} on ${{ matrix.system }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Tell whether code changed
        id: changes
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo 'code=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          code=$(git diff --name-only "$BASE" "$GITHUB_SHA" | grep -vE '\.md$|^LICENSE$' || true)
          if [ -n "$code" ]; then echo 'code=true'; else echo 'code=false'; fi >> "$GITHUB_OUTPUT"

      - name: Set up smalltalkCI
        if: ${{ steps.changes.outputs.code == 'true' }}
        uses: hpi-swa/setup-smalltalkCI@v1
        with:
          smalltalk-image: Pharo64-${{ matrix.pharo }}

      - name: Test
        if: ${{ steps.changes.outputs.code == 'true' }}
        run: smalltalkci -s Pharo64-${{ matrix.pharo }}
        shell: bash
        timeout-minutes: 15

  # release.yml reads the version out of Pharo source. Running the same script
  # here means the method it names cannot be renamed without failing the pull
  # request that renames it.
  versions:
    name: Release version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Read the version the release reads
        run: .github/scripts/versions.sh check

  # The one check main's ruleset requires: it fails unless every job above
  # passed, so the rule names no job and a matrix can change without it.
  gate:
    name: All jobs passed
    needs: [test, versions]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check every job
        run: test "${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && !contains(needs.*.result, 'skipped') }}" = true
