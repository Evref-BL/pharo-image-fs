name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - LICENSE
  pull_request:
    paths-ignore:
      - '**.md'
      - LICENSE
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-26
          - ubuntu-24.04
        smalltalk:
          - Pharo64-12
          - Pharo64-13
          - Pharo64-14
          - Pharo64-15

    name: ${{ matrix.smalltalk }} on ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up smalltalkCI
        uses: hpi-swa/setup-smalltalkCI@v1
        with:
          smalltalk-image: ${{ matrix.smalltalk }}

      - name: Test
        run: smalltalkci -s ${{ matrix.smalltalk }}
        shell: bash
        timeout-minutes: 15

  # release.yml and update-mcp.yml read these two versions out of Pharo source.
  # Running the same script here means a method they name cannot be renamed
  # without failing the pull request that renames it.
  versions:
    name: Release versions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Read the versions the release automation reads
        run: .github/scripts/versions.sh check
