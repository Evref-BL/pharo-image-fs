name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - LICENSE
  pull_request:
    paths-ignore:
      - '**.md'
      - LICENSE
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { pharo: 12, system: Linux, runner: ubuntu-24.04 }
          - { pharo: 13, system: Linux, runner: ubuntu-24.04 }
          - { pharo: 14, system: Linux, runner: ubuntu-24.04 }
          - { pharo: 15, system: Linux, runner: ubuntu-24.04 }
          # One macOS job: macOS runners queue long and are often never
          # given, and what macOS adds over Linux is the platform code, which
          # does not depend on the Pharo version.
          - { pharo: 14, system: macOS, runner: macos-26 }

    name: Pharo ${{ matrix.pharo }} on ${{ matrix.system }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up smalltalkCI
        uses: hpi-swa/setup-smalltalkCI@v1
        with:
          smalltalk-image: Pharo64-${{ matrix.pharo }}

      - name: Test
        run: smalltalkci -s Pharo64-${{ matrix.pharo }}
        shell: bash
        timeout-minutes: 15

  # release.yml and update-mcp.yml read these two versions out of Pharo source.
  # Running the same script here means a method they name cannot be renamed
  # without failing the pull request that renames it.
  versions:
    name: Release versions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Read the versions the release automation reads
        run: .github/scripts/versions.sh check

  # The one check main's ruleset requires: it fails unless every job above
  # passed, so the rule names no job and a matrix can change without it.
  gate:
    name: All jobs passed
    needs: [test, versions]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check every job
        run: test "${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && !contains(needs.*.result, 'skipped') }}" = true
